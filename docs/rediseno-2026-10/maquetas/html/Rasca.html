<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Popup rasca-rasca</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,500;1,500&amp;family=Source+Serif+4:opsz,wght@8..60,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a0a0a}
a{color:#ededed}a:hover{color:#ffffff}
</style>

<div style="position: relative; width: 1280px; height: 800px; overflow: hidden; background: #0a0a0a; font-family: 'Source Serif 4', Georgia, serif; color: #ededed;">
  <img src="assets/08d1f51705ca94868095bcb3a00a6b63.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: blur(3px) brightness(0.45);">
  <div style="position: absolute; inset: 0; background: rgba(10,10,10,0.45);"></div>

  <div role="dialog" aria-label="Tu regalo" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 520px; box-sizing: border-box; padding: 40px 44px 36px; border-radius: 26px; background: #12110f; border: 1px solid #2c2a26; box-shadow: 0 30px 80px rgba(0,0,0,0.6); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center;">
    <button type="button" aria-label="Cerrar" style="position: absolute; right: 16px; top: 16px; width: 44px; height: 44px; border-radius: 999px; border: none; background: transparent; color: #8f8c85; cursor: pointer; display: flex; align-items: center; justify-content: center;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>

    <span style="font-family: Archivo, sans-serif; font-size: 12px; letter-spacing: 0.2em; color: #b9a8f5;">UN REGALO PARA EMPEZAR</span>

    
      <h2 style="margin: 0; font-family: 'Playfair Display', Georgia, serif; font-weight: 500; font-size: 34px; line-height: 1.12; color: #ffffff;">Rasca y llévate un regalo para su libro.</h2>
      <p style="margin: 0; font-size: 17px; line-height: 1.5; color: #c9c6be;">Déjanos tu email y rasca la foto para descubrir tu regalo para su libro.</p>
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; margin-top: 6px;">
        <label for="rasca-email" style="text-align: left; font-family: Archivo, sans-serif; font-size: 13px; color: #b4b1a9;">Tu email</label>
        <input id="rasca-email" type="email" placeholder="nombre@email.com" value="" onChange="" style="height: 52px; padding: 0 18px; border-radius: 14px; border: 1px solid #3a3833; background: #0a0a0a; color: #ffffff; font-family: Archivo, sans-serif; font-size: 16px; outline: none;">
        
        <button type="button" onClick="" style="height: 54px; border-radius: 999px; border: none; background: #a08ce8; color: #14140f; font-family: Archivo, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer;">Quiero rascar mi regalo</button>
      </div>
      <span style="font-family: Archivo, sans-serif; font-size: 12px; color: #8f8c85;">Todas las tarjetas tienen premio. Sin spam: solo ideas y avisos de Vitácora.</span>
    

    

    
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 'email', email: '', showErr: false, pct: 0 };
  }
  setupCanvas(el) {
    if (!el || el._vit) return;
    el._vit = true;
    var self = this;
    var ctx = el.getContext('2d');
    var W = el.width, H = el.height;
    var img = new Image();
    img.onload = function () {
      ctx.save();
      try { ctx.filter = 'sepia(1) contrast(0.85) brightness(0.75) blur(1.5px)'; } catch (e) {}
      var s = Math.max(W / img.width, H / img.height);
      var w = img.width * s, h = img.height * s;
      ctx.drawImage(img, (W - w) / 2, (H - h) / 2.6, w, h);
      ctx.restore();
      ctx.fillStyle = 'rgba(40,30,18,0.35)';
      ctx.fillRect(0, 0, W, H);
      for (var i = 0; i < 2600; i++) {
        ctx.fillStyle = 'rgba(255,240,210,' + (Math.random() * 0.08) + ')';
        ctx.fillRect(Math.random() * W, Math.random() * H, 1.5, 1.5);
      }
      ctx.strokeStyle = 'rgba(255,240,210,0.55)';
      ctx.lineWidth = 2;
      ctx.strokeRect(10, 10, W - 20, H - 20);
      ctx.fillStyle = 'rgba(255,248,232,0.95)';
      ctx.font = '600 15px Archivo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('RASCA AQUÍ', W / 2, H / 2 + 5);
    };
    img.src = 'assets/13e82671c50dac6fa670404e209c9b59.jpg';
    var down = false, last = null;
    function pos(e) { var r = el.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
    function scratch(p) {
      ctx.globalCompositeOperation = 'destination-out';
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 46;
      ctx.beginPath();
      if (last) { ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); }
      else { ctx.arc(p.x, p.y, 23, 0, Math.PI * 2); ctx.fill(); }
      ctx.globalCompositeOperation = 'source-over';
      last = p;
    }
    function measure() {
      var d = ctx.getImageData(0, 0, W, H).data, clear = 0, tot = 0;
      for (var i = 3; i < d.length; i += 4 * 16) { tot++; if (d[i] < 40) clear++; }
      var pct = Math.round(100 * clear / tot);
      self.setState({ pct: pct });
      if (pct >= 55) setTimeout(function () { self.setState({ step: 'won' }); }, 450);
    }
    el.addEventListener('pointerdown', function (e) { down = true; last = null; try { el.setPointerCapture(e.pointerId); } catch (x) {} scratch(pos(e)); });
    el.addEventListener('pointermove', function (e) { if (down) scratch(pos(e)); });
    el.addEventListener('pointerup', function () { down = false; last = null; measure(); });
    el.addEventListener('pointercancel', function () { down = false; last = null; });
  }
  renderVals() {
    var st = this.state, self = this;
    var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(st.email);
    return {
      isEmail: st.step === 'email',
      isScratch: st.step === 'scratch',
      isWon: st.step === 'won',
      email: st.email,
      showErr: st.showErr,
      progressText: st.pct > 0 ? 'Sigue rascando… ' + st.pct + ' %' : 'Arrastra sobre la foto para revelar tu regalo',
      onEmail: function (e) { self.setState({ email: e.target.value, showErr: false }); },
      toScratch: function () { if (ok) self.setState({ step: 'scratch', pct: 0 }); else self.setState({ showErr: true }); },
      canvasRef: function (el) { self.setupCanvas(el); },
      reset: function () { self.setState({ step: 'email', email: '', showErr: false, pct: 0 }); }
    };
  }
}
</script>
</body>
</html>
