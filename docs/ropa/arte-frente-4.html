<!doctype html>

</svg>
<script>
const A=[[13.86,17.63],[26.77,34.07],[39.35,50.08],[51.71,65.82],[63.92,81.36],[76.01,96.74],[88,112]];

for(const [rx,ry] of A) for(const s of [-1,1]){const e=document.createElementNS('http://www.w3.org/2000/svg','ellipse');e.setAttribute('cx',s*rx);e.setAttribute('cy',0);e.setAttribute('rx',rx);e.setAttribute('ry',ry);g.appendChild(e);}
