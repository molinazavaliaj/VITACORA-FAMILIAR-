# La fábrica corre ffmpeg (audiolibro: loudnorm + concat) y Playwright/Chromium
# (libro y previsualización → PDF) — ninguno de los dos viene con la imagen
# base de Railway, hay que pedirlos explícitamente.
#
# PLAYWRIGHT_BROWSERS_PATH=0 hace que Playwright instale Chromium ADENTRO de
# node_modules/ en vez de en ~/.cache/ms-playwright. Railway arma la imagen
# de runtime solo con lo que quedó en el working dir (node_modules incluido)
# y descarta todo lo demás — sin esto, el Chromium que se instala acá en el
# build desaparece antes de que el worker arranque, y browserType.launch()
# revienta buscando un ejecutable que ya no está.

[variables]
PLAYWRIGHT_BROWSERS_PATH = '0'

[phases.setup]
nixPkgs = ["ffmpeg"]

[phases.install]
cmds = ["npm install", "npx playwright install --with-deps chromium"]

[phases.build]
cmds = ["npm run build"]
