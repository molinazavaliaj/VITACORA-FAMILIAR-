# Versión de prueba del rediseño (fase 0, docs/rediseno-2026-10/PASO-DE-MANOS.md §3.2).
#
# Igual que deploy-web.yml pero sin --prod: cada push a la rama rediseno-web
# publica un deployment de Preview en Vercel (con las variables del entorno
# Preview: pagos de prueba) y le pone el alias fijo de abajo. La web de verdad
# no cambia. Usa los mismos secretos VERCEL_* que el deploy de producción.

name: Preview web (rediseño)

on:
  push:
    branches: [rediseno-web]
    paths:
      - "web/**"
      - ".github/workflows/preview-web.yml"
  workflow_dispatch:

concurrency:
  group: preview-web
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ALIAS: vitacora-rediseno.vercel.app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instalar
        run: npm ci

      - name: Tests
        run: npm test

      - name: Vercel CLI
        run: npm i -g vercel@64.2.0

      # Sin `vercel pull` + `vercel build` local: las variables marcadas como
      # sensibles en Vercel (precios nuevos, URL_BASE, claves) no se bajan y el
      # build de acá las leía vacías (el impreso desaparecía de /comprar). El
      # build lo hace Vercel en sus servidores, que sí las tienen.
      - name: Deploy (preview) y alias fijo
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          URL=$(vercel deploy --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "Preview: $URL"
          # El alias va por la API: `vercel alias set` pide /v2/user y con este token da 404.
          API=https://api.vercel.com
          ID=$(curl -fsS -H "Authorization: Bearer $TOKEN" "$API/v13/deployments/${URL#https://}?teamId=$VERCEL_ORG_ID" | jq -r .id)
          curl --fail-with-body -sS -o /dev/null -w "alias: %{http_code}\n" -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"alias\":\"$ALIAS\"}" "$API/v2/deployments/$ID/aliases?teamId=$VERCEL_ORG_ID"
          echo "### Preview: https://$ALIAS" >> "$GITHUB_STEP_SUMMARY"
